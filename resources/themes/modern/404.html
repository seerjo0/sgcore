<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Site</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-modern not-found">

<header class="site-header">
    <div class="container header-inner">
        <a href="/" class="brand">
            <span class="brand-logo" data-cms-slot="site.logo"></span>
            <span class="brand-name" data-cms-slot="site.name">Meu Site</span>
        </a>
        <nav class="main-nav" aria-label="Principal">
            <ul class="nav-list" data-cms-menu="primary"></ul>
        </nav>
    </div>
</header>

<main class="container section">
    <div class="error-404">
        <p class="error-code">404</p>
        <h1>Esta página saiu do ar</h1>
        <p>O endereço não existe ou o conteúdo ainda não foi publicado.</p>
        <a class="button" href="/">Voltar para o início</a>
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-inner">
        <span class="brand-name" data-cms-slot="site.name">Meu Site</span>
        <p class="copyright" data-cms-slot="site.copyright">© Meu Site</p>
        <ul class="nav-list nav-list--footer" data-cms-menu="footer"></ul>
    </div>
</footer>

</body>
</html>
